name: cs-session
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  launcher:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build static launcher and run Linux container tests
        run: tools/cs-session/build.sh test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cs-session-linux-arm64
          path: tools/cs-session/dist/linux-arm64/cs-session
          if-no-files-found: error
